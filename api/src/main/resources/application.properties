spring.application.name=northwind-api

# Environnement actif : dev, prod, ou formation (voir application-{profil}.properties).
# Peut aussi etre force via la variable d'environnement SPRING_PROFILES_ACTIVE,
# sans modifier ce fichier (pratique pour un meme livrable deploye sur plusieurs environnements).
spring.profiles.active=dev

# La connexion (URL, schema, utilisateur, mot de passe chiffre) est definie par
# profil dans application-{profil}.properties et construite par DataSourceConfig.
spring.jpa.hibernate.ddl-auto=none
# Les noms de colonnes sont deja explicites (@Column(name = "...")) : on desactive la conversion
# camelCase -> snake_case de Spring Boot, qui casse les bases en PascalCase (ex: CategoryName).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.default_schema=${app.datasource.schema}
spring.jpa.show-sql=false

server.port=8080

# CORS (client web, ex: l'interface Angular generee, servie en dev sur localhost:4200)
app.cors.allowed-origin=http://localhost:4200

# Securite (JWT) - secret genere aleatoirement a la creation du projet
security.jwt.secret=${JWT_SECRET:demo-only-change-me-use-a-long-random-secret-in-any-real-deployment}
security.jwt.expiration-minutes=120

# Compte admin cree automatiquement au 1er demarrage, avec acces a tous les
# endpoints catalogues (pratique pour tester l'UI generee). A desactiver/changer
# une fois vos propres utilisateurs, roles et permissions mis en place.
security.bootstrap.enabled=true
security.bootstrap.admin-username=admin
security.bootstrap.admin-password=${ADMIN_PASSWORD:admin}

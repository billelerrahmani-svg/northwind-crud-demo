            <div class="flex justify-content-between align-items-center mb-4">
              <h2 class="m-0">{{ 'entities.current-product-list' | translate }}</h2>
              <button
                pButton
                type="button"
                [label]="'common.export' | translate"
                icon="pi pi-file-excel"
                severity="secondary"
                outlined
                [disabled]="!totalRecords()"
                (click)="exportExcel()">
              </button>
            </div>

            <p-table
              #dt
              [value]="items()"
              [lazy]="true"
              (onLazyLoad)="load($event)"
              [totalRecords]="totalRecords()"
              [loading]="loading()"
              [paginator]="true"
              [rows]="15"
              [rowsPerPageOptions]="[15, 25, 50]"
              responsiveLayout="scroll">

              <ng-template pTemplate="caption">
                <div class="flex justify-content-end">
                  <input
                    pInputText
                    type="text"
                    [placeholder]="'table.searchPlaceholder' | translate"
                    (input)="onGlobalSearch($any($event.target).value, dt)">
                </div>
              </ng-template>

              <ng-template pTemplate="header">
                <tr>
                  <th pSortableColumn="productid">{{ 'fields.current-product-list.productid' | translate }} <p-sortIcon field="productid" /></th>
                  <th pSortableColumn="productname">{{ 'fields.current-product-list.productname' | translate }} <p-sortIcon field="productname" /></th>

                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-item>
                <tr>
                  <td>{{ item.productid }}</td>
                  <td>{{ item.productname }}</td>

                </tr>
              </ng-template>
            </p-table>

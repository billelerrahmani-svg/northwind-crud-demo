<p-card [header]="isEdit() ? ('table.editTitle' | translate) : ('table.addTitle' | translate)">
  <form [formGroup]="form">
    <div class="formgrid grid">
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.categories.categoryname' | translate }}</label>
    <input pInputText formControlName="categoryname" class="w-full" maxlength="15" />
    <app-field-error [control]="form.get('categoryname')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.categories.description' | translate }}</label>
    <input pInputText formControlName="description" class="w-full" />
    <app-field-error [control]="form.get('description')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.categories.picture' | translate }}</label>
    <input pInputText formControlName="picture" class="w-full" />
    <app-field-error [control]="form.get('picture')" />
  </div>

    </div>
    <div class="flex justify-content-end gap-2 mt-4">
      <button pButton type="button" [label]="'common.cancel' | translate" text (click)="onCancel()"></button>
      <!-- Volontairement actif même si le formulaire est invalide : le clic
           fait alors apparaître les messages sous les champs fautifs. -->
      <button pButton type="button" [label]="'common.save' | translate" (click)="onSave()"></button>
    </div>
  </form>
</p-card>

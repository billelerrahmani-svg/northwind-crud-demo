<p-card [header]="isEdit() ? ('table.editTitle' | translate) : ('table.addTitle' | translate)">
  <form [formGroup]="form">
    <div class="formgrid grid">
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.region.regionid' | translate }}</label>
    <p-inputNumber formControlName="regionid" styleClass="w-full" [maxFractionDigits]="0" [min]="-2147483648" [max]="2147483647" />
    <app-field-error [control]="form.get('regionid')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.region.regiondescription' | translate }}</label>
    <input pInputText formControlName="regiondescription" class="w-full" maxlength="50" />
    <app-field-error [control]="form.get('regiondescription')" />
  </div>

    </div>
    <div class="flex justify-content-end gap-2 mt-4">
      <button pButton type="button" [label]="'common.cancel' | translate" text (click)="onCancel()"></button>
      <!-- Volontairement actif même si le formulaire est invalide : le clic
           fait alors apparaître les messages sous les champs fautifs. -->
      <button pButton type="button" [label]="'common.save' | translate" (click)="onSave()"></button>
    </div>
  </form>
</p-card>

<div class="flex justify-content-between align-items-center mb-4">
  <h2 class="m-0">{{ 'admin.users.title' | translate }}</h2>

  <button
    pButton
    type="button"
    [label]="'common.add' | translate"
    icon="pi pi-plus"
    (click)="openCreate()">
  </button>
</div>

<p-table
  [value]="users()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="10"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>{{ 'admin.users.username' | translate }}</th>
      <th>{{ 'admin.users.role' | translate }}</th>
      <th>{{ 'admin.users.active' | translate }}</th>
      <th style="width:12rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.roleLabel }}</td>
      <td>{{ user.enabled ? ('common.yes' | translate) : ('common.no' | translate) }}</td>
      <td>
        <div class="flex gap-2 justify-content-end">

          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            text
            (click)="openEdit(user)">
          </button>

          <button
            pButton
            type="button"
            icon="pi pi-key"
            text
            (click)="openResetPassword(user)">
          </button>

          <button
            pButton
            type="button"
            icon="pi pi-trash"
            severity="danger"
            text
            (click)="confirmDelete(user)">
          </button>

        </div>
      </td>
    </tr>
  </ng-template>

</p-table>

<p-dialog
  [header]="'admin.users.username' | translate"
  [visible]="formVisible()"
  (visibleChange)="formVisible.set($event)"
  [modal]="true"
  [style]="{ width: '28rem' }">

  <form
    [formGroup]="form"
    (ngSubmit)="onSave()"
    class="flex flex-column gap-4"
    novalidate>

    <div class="flex flex-column gap-2">

      <label for="username">{{ 'admin.users.username' | translate }}</label>

      <input
        pInputText
        id="username"
        formControlName="username"
        [readonly]="!isNew()" />

    </div>

    @if (isNew()) {

      <div class="flex flex-column gap-2">

        <label for="password">{{ 'admin.users.password' | translate }}</label>

        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [fluid]="true">
        </p-password>

      </div>

    }

    <div class="flex flex-column gap-2">

      <label for="role">{{ 'admin.users.role' | translate }}</label>

      <p-select
        formControlName="roleId"
        [options]="roles()"
        optionLabel="designation"
        optionValue="id"
        [placeholder]="'admin.users.noRole' | translate">
      </p-select>

    </div>

    <div class="flex align-items-center gap-2">

      <p-checkbox
        inputId="enabled"
        formControlName="enabled"
        [binary]="true">
      </p-checkbox>

      <label for="enabled">{{ 'admin.users.active' | translate }}</label>

    </div>

    <ng-template pTemplate="footer">

      <button
        pButton
        type="button"
        [label]="'common.cancel' | translate"
        severity="secondary"
        text
        (click)="onHideForm()">
      </button>

      <button
        pButton
        type="submit"
        [label]="'common.save' | translate">
      </button>

    </ng-template>

  </form>

</p-dialog>

<p-dialog
  [header]="'admin.users.resetPasswordTitle' | translate"
  [visible]="resetPasswordVisible()"
  (visibleChange)="resetPasswordVisible.set($event)"
  [modal]="true"
  [style]="{ width: '24rem' }">

  <form
    [formGroup]="resetPasswordForm"
    (ngSubmit)="onResetPassword()"
    class="flex flex-column gap-4"
    novalidate>

    <div class="flex flex-column gap-2">

      <label for="newPassword">{{ 'admin.users.newPassword' | translate }}</label>

      <p-password
        id="newPassword"
        formControlName="password"
        [toggleMask]="true"
        [fluid]="true">
      </p-password>

    </div>

    <ng-template pTemplate="footer">

      <button
        pButton
        type="button"
        [label]="'common.cancel' | translate"
        severity="secondary"
        text
        (click)="resetPasswordVisible.set(false)">
      </button>

      <button
        pButton
        type="submit"
        [label]="'common.confirm' | translate">
      </button>

    </ng-template>

  </form>

</p-dialog>

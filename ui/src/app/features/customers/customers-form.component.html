<p-card [header]="isEdit() ? ('table.editTitle' | translate) : ('table.addTitle' | translate)">
  <form [formGroup]="form">
    <div class="formgrid grid">
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.customerid' | translate }}</label>
    <input pInputText formControlName="customerid" class="w-full" maxlength="5" />
    <app-field-error [control]="form.get('customerid')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.companyname' | translate }}</label>
    <input pInputText formControlName="companyname" class="w-full" maxlength="40" />
    <app-field-error [control]="form.get('companyname')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.contactname' | translate }}</label>
    <input pInputText formControlName="contactname" class="w-full" maxlength="30" />
    <app-field-error [control]="form.get('contactname')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.contacttitle' | translate }}</label>
    <input pInputText formControlName="contacttitle" class="w-full" maxlength="30" />
    <app-field-error [control]="form.get('contacttitle')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.address' | translate }}</label>
    <input pInputText formControlName="address" class="w-full" maxlength="60" />
    <app-field-error [control]="form.get('address')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.city' | translate }}</label>
    <input pInputText formControlName="city" class="w-full" maxlength="15" />
    <app-field-error [control]="form.get('city')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.region' | translate }}</label>
    <input pInputText formControlName="region" class="w-full" maxlength="15" />
    <app-field-error [control]="form.get('region')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.postalcode' | translate }}</label>
    <input pInputText formControlName="postalcode" class="w-full" maxlength="10" />
    <app-field-error [control]="form.get('postalcode')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.country' | translate }}</label>
    <input pInputText formControlName="country" class="w-full" maxlength="15" />
    <app-field-error [control]="form.get('country')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.phone' | translate }}</label>
    <input pInputText formControlName="phone" class="w-full" maxlength="24" />
    <app-field-error [control]="form.get('phone')" />
  </div>
  <div class="field col-12 md:col-6">
    <label>{{ 'fields.customers.fax' | translate }}</label>
    <input pInputText formControlName="fax" class="w-full" maxlength="24" />
    <app-field-error [control]="form.get('fax')" />
  </div>

    </div>
    <div class="flex justify-content-end gap-2 mt-4">
      <button pButton type="button" [label]="'common.cancel' | translate" text (click)="onCancel()"></button>
      <!-- Volontairement actif même si le formulaire est invalide : le clic
           fait alors apparaître les messages sous les champs fautifs. -->
      <button pButton type="button" [label]="'common.save' | translate" (click)="onSave()"></button>
    </div>
  </form>
</p-card>
